<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Developer Portfolio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      width:350px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .avatar{
      width:100px;
      height:100px;
      border-radius:50%;
      background:#3b82f6;
      margin:0 auto 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:40px;
      font-weight:bold;
    }

    h1{
      margin-bottom:10px;
      font-size:28px;
    }

    .role{
      color:#94a3b8;
      margin-bottom:20px;
      font-size:15px;
    }

    .description{
      font-size:14px;
      line-height:1.7;
      color:#cbd5e1;
      margin-bottom:30px;
    }

    .buttons{
      display:flex;
      gap:10px;
      justify-content:center;
    }

    .btn{
      text-decoration:none;
      padding:12px 18px;
      border-radius:10px;
      font-size:14px;
      transition:0.3s;
    }

    .primary{
      background:#3b82f6;
      color:white;
    }

    .primary:hover{
      background:#2563eb;
    }

    .secondary{
      border:1px solid #475569;
      color:white;
    }

    .secondary:hover{
      background:#334155;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="avatar">D</div>

    <h1>Developer Portfolio</h1>

    <p class="role">
      Frontend Developer • JavaScript Enthusiast
    </p>

    <p class="description">
      Passionate about building modern web applications,
      interactive user interfaces, and creative digital experiences.
    </p>

    <div class="buttons">
      <a href="#" class="btn primary">Projects</a>
      <a href="#" class="btn secondary">Contact</a>
    </div>

  </div>

</body>
</html>
